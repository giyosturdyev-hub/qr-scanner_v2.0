<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1976d2"
  >

  <title>Сканер серийных номеров</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 16px;

      background: #f2f4f7;

      color: #1f2937;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    }


    .app {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

    }


    h1 {

      text-align: center;

      font-size: 25px;

      margin:
        10px 0 18px;

    }


    .hidden {
      display: none !important;
    }


    /* PIN */

    .pin-screen {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .pin-box {

      width: min(92vw, 420px);

      background: white;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 4px 24px
        rgba(0,0,0,.10);

      text-align: center;

    }


    .pin-title {

      font-size: 23px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    .pin-subtitle {

      color: #6b7280;

      margin-bottom: 18px;

    }


    .pin-input {

      width: 100%;

      padding: 15px;

      border:
        1px solid #d1d5db;

      border-radius: 12px;

      font-size: 24px;

      text-align: center;

      letter-spacing: 5px;

      outline: none;

    }


    /* FORM */

    .setup {

      background: white;

      padding: 16px;

      border-radius: 14px;

      margin-bottom: 14px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-weight: 600;

    }


    .field {

      margin-bottom: 14px;

    }


    input {

      width: 100%;

      padding: 14px;

      border:
        1px solid #d1d5db;

      border-radius: 12px;

      font-size: 17px;

      outline: none;

    }


    button {

      width: 100%;

      margin-top: 12px;

      padding: 15px;

      border: 0;

      border-radius: 12px;

      font-size: 18px;

      font-weight: 600;

      background: #1976d2;

      color: white;

      cursor: pointer;

    }


    button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    /* CAMERA */

    #reader {

      width: 100%;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

    }


    .status {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background: white;

      text-align: center;

      font-size: 18px;

      line-height: 1.4;

      min-height: 65px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .info {

      color: #374151;

    }


    .success {

      background: #e8f7ed;

      color: #137333;

      font-weight: 700;

    }


    .error {

      background: #fdeaea;

      color: #b42318;

      font-weight: 700;

    }


    /* COUNTER */

    .counter {

      margin-top: 12px;

      padding: 18px;

      background: white;

      border-radius: 14px;

      text-align: center;

    }


    .counter-title {

      color: #6b7280;

      font-size: 15px;

    }


    .counter-number {

      display: block;

      margin-top: 4px;

      font-size: 40px;

      font-weight: 700;

    }


    .last {

      margin-top: 12px;

      padding: 14px;

      background: white;

      border-radius: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 600;

      word-break: break-word;

    }


    .executor-info {

      margin-bottom: 12px;

      padding: 12px;

      background: white;

      border-radius: 12px;

      text-align: center;

      color: #374151;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       PIN
  ====================================================== -->

  <div
    id="pinScreen"
    class="pin-screen"
  >

    <div class="pin-box">

      <div class="pin-title">
        🔐 Доступ к сканеру
      </div>

      <div class="pin-subtitle">
        Введите PIN-код
      </div>

      <input
        id="pinInput"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="5"
        autocomplete="off"
        placeholder="•••••"
      >

      <button
        onclick="checkPin()"
      >
        Войти
      </button>

      <div
        id="pinError"
        style="
          min-height:22px;
          margin-top:10px;
          color:#b42318;
        "
      ></div>

    </div>

  </div>


  <!-- =====================================================
       APPLICATION
  ====================================================== -->

  <div
    id="app"
    class="app hidden"
  >

    <h1>
      Сканер серийных номеров
    </h1>


    <!-- ФИО -->

    <div
      id="setup"
      class="setup"
    >

      <div class="field">

        <label for="executor">
          ФИО исполнителя
        </label>

        <input
          id="executor"
          type="text"
          autocomplete="name"
          placeholder="Введите ФИО"
        >

      </div>


      <button
        id="startButton"
        onclick="startScanner()"
      >
        📷 Начать сканирование
      </button>

    </div>


    <!-- Информация -->

    <div
      id="executorInfo"
      class="executor-info hidden"
    ></div>


    <!-- Камера -->

    <div id="reader"></div>


    <!-- Статус -->

    <div
      id="status"
      class="status info"
    >
      Введите ФИО и нажмите
      «Начать сканирование».
    </div>


    <!-- Счётчик -->

    <div class="counter">

      <div class="counter-title">
        Отсканировано кодов
      </div>

      <span
        id="counter"
        class="counter-number"
      >
        0
      </span>

    </div>


    <!-- Последний код -->

    <div
      id="last"
      class="last"
    >
      Последний номер: —
    </div>

  </div>


  <script>

    /* =====================================================
       НАСТРОЙКИ
    ====================================================== */

    const PIN = "77777";


    const API_URL =
      "https://script.google.com/macros/s/AKfycbxiZia7qBQmlgRQTm9eRX7qmRmczYimSoltss3URIbodkp5ZGPLO-Htl_7pVqAaqPPUaA/exec";


    /* =====================================================
       СОСТОЯНИЕ
    ====================================================== */

    let scanner = null;

    let scannerRunning = false;

    let processing = false;

    let count = 0;

    let lastScannedSerial = "";

    let lastScannedTime = 0;

    let executor = "";


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const pinScreen =
      document.getElementById(
        "pinScreen"
      );


    const pinInput =
      document.getElementById(
        "pinInput"
      );


    const pinError =
      document.getElementById(
        "pinError"
      );


    const app =
      document.getElementById(
        "app"
      );


    const executorInput =
      document.getElementById(
        "executor"
      );


    const setup =
      document.getElementById(
        "setup"
      );


    const executorInfo =
      document.getElementById(
        "executorInfo"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const statusEl =
      document.getElementById(
        "status"
      );


    const counterEl =
      document.getElementById(
        "counter"
      );


    const lastEl =
      document.getElementById(
        "last"
      );


    /* =====================================================
       PIN
    ====================================================== */

    function checkPin() {

      const value =
        pinInput.value.trim();


      if (value === PIN) {

        pinScreen.classList.add(
          "hidden"
        );

        app.classList.remove(
          "hidden"
        );

        pinError.textContent = "";

        executorInput.focus();

      } else {

        pinError.textContent =
          "Неверный PIN-код";

        pinInput.value = "";

        pinInput.focus();

      }

    }


    pinInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          checkPin();

        }

      }
    );


    /* =====================================================
       STATUS
    ====================================================== */

    function setStatus(
      text,
      type
    ) {

      statusEl.className =
        "status " + type;

      statusEl.textContent =
        text;

    }


    /* =====================================================
       START SCANNER
    ====================================================== */

    function startScanner() {

      if (scannerRunning) {
        return;
      }


      executor =
        executorInput.value.trim();


      if (!executor) {

        alert(
          "Введите ФИО исполнителя."
        );

        executorInput.focus();

        return;

      }


      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {

        setStatus(
          "Не загрузилась библиотека сканера.",
          "error"
        );

        return;

      }


      startButton.disabled = true;

      executorInput.disabled = true;


      executorInfo.textContent =
        "Исполнитель: " +
        executor;


      executorInfo.classList.remove(
        "hidden"
      );


      setStatus(
        "Запрашиваем доступ к камере…",
        "info"
      );


      scanner =
        new Html5Qrcode(
          "reader"
        );


      scanner
        .start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            aspectRatio: 1.0

          },

          onScanSuccess,

          function() {
            // Ошибки отдельных кадров
            // игнорируем.
          }

        )

        .then(function() {

          scannerRunning = true;

          setStatus(
            "Наведите камеру на QR-код",
            "info"
          );

        })

        .catch(function(error) {

          scannerRunning = false;

          startButton.disabled = false;

          executorInput.disabled = false;

          setStatus(
            "Не удалось открыть камеру: " +
            error,
            "error"
          );

        });

    }


    /* =====================================================
       QR FOUND
    ====================================================== */

    function onScanSuccess(
      decodedText
    ) {

      if (processing) {
        return;
      }


      const serial =
        String(
          decodedText || ""
        ).trim();


      if (!serial) {
        return;
      }


      /*
       * Камера может несколько раз
       * распознать один и тот же QR.
       *
       * Игнорируем повтор в течение 2 секунд.
       */

      const now =
        Date.now();


      if (
        serial ===
          lastScannedSerial &&
        now -
          lastScannedTime <
          2000
      ) {

        return;

      }


      lastScannedSerial =
        serial;

      lastScannedTime =
        now;


      processing = true;


      setStatus(
        "⏳ Записываем: " +
        serial,
        "info"
      );


      saveSerial(serial);

    }


    /* =====================================================
       SAVE
    ====================================================== */

    function saveSerial(
      serial
    ) {

      const callbackName =
        "qrCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;

            cleanup();

            processing = false;


            setStatus(
              "❌ Google Sheets не ответил.",
              "error"
            );

          },
          15000
        );


      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }


          finished = true;

          clearTimeout(timeout);

          cleanup();


          if (
            result &&
            result.success
          ) {

            /*
             * Увеличиваем счётчик
             * только после успешной
             * записи в Google Sheets.
             */

            count++;

            counterEl.textContent =
              count;


            lastEl.textContent =
              "Последний номер: " +
              result.serial;


            setStatus(
              "🟢 Записано: " +
              result.serial,
              "success"
            );


          } else {

            setStatus(
              "❌ Ошибка: " +
              (
                result &&
                result.message
                  ? result.message
                  : "Неизвестная ошибка"
              ),
              "error"
            );

          }


          setTimeout(
            function() {

              processing = false;


              if (
                scannerRunning
              ) {

                setStatus(
                  "Наведите на следующий QR-код",
                  "info"
                );

              }

            },
            800
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;

          clearTimeout(timeout);

          cleanup();

          processing = false;


          setStatus(
            "❌ Не удалось связаться с Google Sheets.",
            "error"
          );

        };


      const url =
        API_URL +
        "?action=save" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&executor=" +
        encodeURIComponent(
          executor
        ) +
        "&serial=" +
        encodeURIComponent(
          serial
        ) +
        "&t=" +
        Date.now();


      script.src = url;


      document.body.appendChild(
        script
      );


      function cleanup() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    }

  </script>

</body>

</html>
