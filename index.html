<body>


<!-- PIN -->

<div
  id="pinScreen"
  class="pin-screen"
>

  <div class="pin-box">

    <div class="pin-title">
      🔐 Доступ к сканеру
    </div>

    <div class="pin-subtitle">
      Введите PIN-код
    </div>

    <input
      id="pinInput"
      class="pin-input"
      type="password"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
      placeholder="•••••"
    >

    <button onclick="checkPin()">
      Войти
    </button>

    <div
      id="pinError"
      style="margin-top:10px;color:#b42318;"
    ></div>

  </div>

</div>


<!-- APPLICATION -->

<div
  id="app"
  class="app hidden"
>

<h1>
  Сканер серийных номеров
</h1>


<!-- SETUP -->

<div
  id="setup"
  class="setup"
>

  <div class="field">

    <label>
      ФИО исполнителя
    </label>

    <input
      id="executor"
      type="text"
      placeholder="Например: Иван Иванов"
      autocomplete="name"

  </div>


  <div class="field">

    <label>

    </label>

      <option value="">
        — Выберите ДУ —
      </option>

        DN15 Modbus
      </option>

      <option value="DN15 LoraWan">
        DN15 LoraWan
      </option>

      <option value="DN20 Modbus">
        DN20 Modbus
      </option>

      <option value="DN20 LoraWan">
        DN20 LoraWan
      </option>

      <option value="DN25 BR">
        DN25 BR
      </option>

      <option value="DN32 BR">
        DN32 BR
      </option>

      <option value="DN40 BR">
        DN40 BR
      </option>

      <option value="DN50 BR">
        DN50 BR
      </option>

      <option value="DN50 CLI">
        DN50 CLI
      </option>

      <option value="DN80 CLI">
        DN80 CLI
      </option>

      <option value="DN100 CLI">
        DN100 CLI
      </option>

      <option value="DN150 CLI">
        DN150 CLI
      </option>

      <option value="DN200 CLI">
        DN200 CLI
      </option>

    </select>

  </div>


  <button
    id="startButton"
    onclick="startScanning()"
  >
    📷 Начать сканирование
  </button>

  <div id="reader"></div>


  <div
    id="status"
    class="status info"
  >
    Нажмите «Запустить камеру»
  </div>


  <button
    id="cameraButton"
    onclick="startCamera()"
  >
    📷 Запустить камеру
  </button>


  <div class="counter">

    <div class="counter-title">

    </div>

    <div

    >

    </div>

  >

  </div>

    Каждый QR-код содержит только серийный номер.
  </div>

</div>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const PIN = "77777";


const API_URL =
  "https://script.google.com/macros/s/AKfycbzMYkqDFdgOMWqWfoeAfOvXtXMIPWybdJ8gg2wCF34VOrkZCvFLHWAx8Q20w94hStuhsw/exec";


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let scanner = null;

let scanning = false;

let processing = false;

let count = 0;

let lastSerial = "";

let lastScanTime = 0;

let executor = "";

let du = "";


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const pinScreen =
  document.getElementById("pinScreen");

const app =
  document.getElementById("app");

const pinInput =
  document.getElementById("pinInput");

const pinError =
  document.getElementById("pinError");

const executorInput =
  document.getElementById("executor");

const duSelect =
  document.getElementById("du");

const setup =
  document.getElementById("setup");

const scannerBlock =
  document.getElementById("scannerBlock");

const statusEl =
  document.getElementById("status");

const cameraButton =
  document.getElementById("cameraButton");

const counterEl =
  document.getElementById("counter");

const lastEl =
  document.getElementById("last");


/* =========================================================
   PIN
========================================================= */

function checkPin() {

  if (pinInput.value === PIN) {

    pinScreen.classList.add("hidden");

    app.classList.remove("hidden");

    pinError.textContent = "";

    executorInput.focus();

  } else {

    pinError.textContent =
      "Неверный PIN-код";

    pinInput.value = "";

    pinInput.focus();

  }

}


pinInput.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Enter") {
      checkPin();
    }

  }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(text, cls) {

  statusEl.className =
    "status " + cls;

  statusEl.innerHTML = text;

}


/* =========================================================
   START SCANNING
========================================================= */

function startScanning() {

  executor =
    executorInput.value.trim();

  du =
    duSelect.value.trim();


  if (!executor) {

    alert(
      "Введите ФИО исполнителя."
    );

    executorInput.focus();

    return;
  }


  if (!du) {

    alert(
      "Выберите ДУ прибора."
    );

    duSelect.focus();

    return;
  }


  count = 0;

  counterEl.textContent = "0";

  lastEl.textContent =
    "Последний номер: —";


  setup.classList.add("hidden");

  scannerBlock.classList.remove("hidden");


  setStatus(
    "Нажмите «Запустить камеру»",
    "info"
  );

}


/* =========================================================
   START CAMERA
========================================================= */

function startCamera() {

  if (scanning) {
    return;
  }


  cameraButton.disabled = true;


  setStatus(
    "⏳ Запрашиваем доступ к камере…",
    "info"
  );


  try {

    scanner =
      new Html5Qrcode("reader");

  } catch (error) {

    cameraButton.disabled = false;

    setStatus(
      "❌ Ошибка создания камеры",
      "error"
    );

    return;
  }


  scanner
    .start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        fps: 10,

        qrbox: function(width, height) {

          const size =
            Math.floor(
              Math.min(width, height) * 0.70
            );

          return {
            width: Math.max(180, size),
            height: Math.max(180, size)
          };

        }

      },

      onScanSuccess,

      function() {}

    )

    .then(function() {

      scanning = true;

      setStatus(
        "📷 Наведите камеру на QR-код",
        "info"
      );

    })

    .catch(function(error) {

      scanning = false;

      cameraButton.disabled = false;

      setStatus(
        "❌ Не удалось открыть камеру.<br><small>" +
        escapeHtml(error) +
        "</small>",
        "error"
      );

    });

}


/* =========================================================
   QR
========================================================= */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  const serial =
    String(decodedText || "")
      .trim();


  if (!serial) {
    return;
  }


  const now =
    Date.now();


  /*
   * Защита от многократного
   * считывания одного QR подряд.
   */

  if (
    serial === lastSerial &&
    now - lastScanTime < 2500
  ) {

    return;
  }


  lastSerial = serial;

  lastScanTime = now;

  processing = true;


  setStatus(
    "⏳ Сохраняем…<br><b>" +
    escapeHtml(serial) +
    "</b>",
    "info"
  );


  saveSerial(serial);

}


/* =========================================================
   SAVE
========================================================= */

function saveSerial(serial) {

  const callbackName =
    "qr_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  let finished = false;


  const timeout =
    setTimeout(
      function() {

        if (finished) return;

        finished = true;

        cleanup();

        processing = false;

        setStatus(
          "❌ Нет ответа от сервера",
          "error"
        );

      },
      15000
    );


  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      cleanup();

      handleSaveResult(result, serial);

    };


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      cleanup();

      processing = false;

      setStatus(
        "❌ Ошибка соединения с Google Sheets",
        "error"
      );

    };


  let url =
    API_URL +
    "?action=save" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&serial=" +
    encodeURIComponent(serial) +
    "&executor=" +
    encodeURIComponent(executor) +
    "&du=" +
    encodeURIComponent(du) +
    "&t=" +
    Date.now();


  script.src = url;

  document.body.appendChild(script);


  function cleanup() {

    delete window[callbackName];

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


/* =========================================================
   RESULT
========================================================= */

function handleSaveResult(result, serial) {

  if (
    result &&
    result.success
  ) {

    count++;

    counterEl.textContent =
      count;


    lastEl.textContent =
      "Последний номер: " +
      serial;


    setStatus(
      "🟢 ДОБАВЛЕНО<br><b>" +
      escapeHtml(serial) +
      "</b>",
      "success"
    );


    setTimeout(
      function() {

        processing = false;

        setStatus(
          "📷 Наведите камеру на следующий QR-код",
          "info"
        );

      },
      700
    );


    return;
  }


  if (
    result &&
    result.duplicate
  ) {

    setStatus(
      "⚠️ ДУБЛИКАТ<br><b>" +
      escapeHtml(serial) +
      "</b><br><small>" +
      escapeHtml(
        result.message || ""
      ) +
      "</small>",
      "warning"
    );


    setTimeout(
      function() {

        processing = false;

        setStatus(
          "📷 Наведите камеру на следующий QR-код",
          "info"
        );

      },
      1200
    );


    return;
  }


  setStatus(
    "❌ Ошибка<br><small>" +
    escapeHtml(
      result &&
      result.message
        ? result.message
        : "Неизвестная ошибка"
    ) +
    "</small>",
    "error"
  );


  processing = false;

}


/* =========================================================
   NEW OPERATOR
========================================================= */

function newOperator() {

  if (scanner && scanning) {

    scanner
      .stop()
      .catch(function() {});

  }


  scanner = null;

  scanning = false;

  processing = false;

  count = 0;

  lastSerial = "";

  lastScanTime = 0;

  executor = "";

  du = "";


  executorInput.value = "";

  duSelect.value = "";


  counterEl.textContent = "0";

  lastEl.textContent =
    "Последний номер: —";


  setup.classList.remove("hidden");

  scannerBlock.classList.add("hidden");

  cameraButton.disabled = false;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
