<script>


/* =========================================================
   НАСТРОЙКИ
========================================================= */

const PIN = "77777";

const API_URL =
  "https://script.google.com/macros/s/AKfycbxiZia7qBQmlgRQTm9eRX7qmRmczYimSoltss3URIbodkp5ZGPLO-Htl_7pVqAaqPPUaA/exec";

const MAX_PER_SESSION = 150;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let scanner = null;

let scanning = false;

let processing = false;

let count = 0;

let dupes = 0;

let lastSerial = "";

let lastScanTime = 0;

let executor = "";

let du = "";

let audioContext = null;


/* =========================================================
   ELEMENTS
========================================================= */

const pinScreen =
  document.getElementById("pinScreen");

const scannerApp =
  document.getElementById("scannerApp");

const pinInput =
  document.getElementById("pinInput");

const pinError =
  document.getElementById("pinError");

const executorInput =
  document.getElementById("executor");

const duSelect =
  document.getElementById("du");

const setupBlock =
  document.getElementById("setupBlock");

const sessionBlock =
  document.getElementById("sessionBlock");

const startBtn =
  document.getElementById("startBtn");

const statusEl =
  document.getElementById("status");

const countEl =
  document.getElementById("count");

const limitEl =
  document.getElementById("limit");

const remainingEl =
  document.getElementById("remaining");

const lastEl =
  document.getElementById("last");

const dateEl =
  document.getElementById("date");


/* =========================================================
   PIN
========================================================= */

function checkPin() {

  if (
    pinInput.value.trim() === PIN
  ) {

    pinScreen.classList.add("hidden");

    scannerApp.classList.remove("hidden");

    pinError.textContent = "";

    pinInput.value = "";

    executorInput.focus();

  } else {

    pinError.textContent =
      "Неверный PIN-код";

    pinInput.value = "";

    pinInput.focus();

  }

}


pinInput.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Enter") {
      checkPin();
    }

  }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  cls
) {

  statusEl.className =
    "status " + cls;

  statusEl.innerHTML =
    text;

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   BEEP
========================================================= */

function beep(ok) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.frequency.value =
      ok ? 880 : 330;

    osc.type = "sine";

    const now =
      audioContext.currentTime;

    gain.gain.setValueAtTime(
      0.001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18,
      now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + (ok ? 0.13 : 0.25)
    );

    osc.start(now);

    osc.stop(
      now + (ok ? 0.14 : 0.26)
    );

  } catch (e) {}

}


/* =========================================================
   API
========================================================= */

function callApi(
  action,
  params,
  callback
) {

  const callbackName =
    "qrCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement("script");

  let finished = false;

  const timeout =
    setTimeout(
      function() {

        if (finished) return;

        finished = true;

        cleanup();

        callback({
          success: false,
          message:
            "Нет ответа от Google Sheets."
        });

      },
      15000
    );


  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      cleanup();

      callback(result);

    };


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      cleanup();

      callback({
        success: false,
        message:
          "Не удалось связаться с Google Sheets."
      });

    };


  let url =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  Object.keys(params || {})
    .forEach(
      function(key) {

        url +=
          "&" +
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(
            params[key]
          );

      }
    );


  script.src = url;

  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];

    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


/* =========================================================
   START SCANNER
========================================================= */

function startScanner() {

  executor =
    executorInput.value.trim();

  du =
    duSelect.value.trim();


  if (!executor) {

    alert(
      "Введите ФИО исполнителя."
    );

    executorInput.focus();

    return;

  }


  if (!du) {

    alert(
      "Выберите ДУ прибора."
    );

    duSelect.focus();

    return;

  }


  count = 0;

  dupes = 0;

  lastSerial = "";

  lastScanTime = 0;

  countEl.textContent = "0";

  limitEl.textContent =
    MAX_PER_SESSION;

  remainingEl.textContent =
    MAX_PER_SESSION;

  dateEl.textContent =
    getToday();


  setupBlock.classList.add(
    "hidden"
  );

  sessionBlock.classList.remove(
    "hidden"
  );


  setStatus(
    "Запрашиваем доступ к камере…",
    "info"
  );


  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  } catch (e) {}


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanning = true;


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );

        return {
          width:
            Math.max(
              180,
              size
            ),

          height:
            Math.max(
              180,
              size
            )
        };

      }

    },

    onScanSuccess,

    function() {}

  )

  .then(
    function() {

      setStatus(
        "Наведите камеру на QR-код",
        "info"
      );

    }
  )

  .catch(
    function(error) {

      scanning = false;

      setupBlock.classList.remove(
        "hidden"
      );

      sessionBlock.classList.add(
        "hidden"
      );

      setStatus(
        "❌ Не удалось открыть камеру<br>" +
        "<small>" +
        esc(error) +
        "</small>",
        "error"
      );

    }
  );

}


/* =========================================================
   QR
========================================================= */

function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  const serial =
    String(
      decodedText || ""
    )
    .trim()
    .replace(
      /\s+/g,
      " "
    );


  if (!serial) {
    return;
  }


  const now =
    Date.now();


  /*
   * Защита от многократного
   * мгновенного чтения одного QR.
   */

  if (
    serial === lastSerial &&
    now - lastScanTime < 2500
  ) {

    return;

  }


  if (
    count >= MAX_PER_SESSION
  ) {

    showLimit();

    return;

  }


  processing = true;

  lastSerial = serial;

  lastScanTime = now;


  setStatus(
    "⏳ Сохраняем<br><b>" +
    esc(serial) +
    "</b>",
    "info"
  );


  saveSerial(serial);

}


/* =========================================================
   SAVE
========================================================= */

function saveSerial(
  serial
) {

  callApi(

    "save",

    {

      serial: serial,

      executor: executor,

      du: du

    },

    function(r) {


      /* -----------------------------------------------
         УСПЕХ
      ------------------------------------------------ */

      if (
        r &&
        r.success
      ) {

        count =
          Number(
            r.count || 0
          );


        countEl.textContent =
          count;


        remainingEl.textContent =
          Math.max(
            0,
            MAX_PER_SESSION - count
          );


        lastEl.textContent =
          "Последний номер: " +
          r.serial;


        setStatus(
          "🟢 ДОБАВЛЕНО<br>" +
          "<b>" +
          esc(r.serial) +
          "</b>",
          "success"
        );


        beep(true);


        if (
          count >= MAX_PER_SESSION
        ) {

          setTimeout(
            function() {

              processing = false;

              showLimit();

            },
            700
          );

          return;

        }


        setTimeout(
          function() {

            processing = false;

            setStatus(
              "Наведите на следующий QR-код",
              "info"
            );

          },
          600
        );


        return;

      }


      /* -----------------------------------------------
         ДУБЛИКАТ
      ------------------------------------------------ */

      if (
        r &&
        r.duplicate
      ) {

        dupes++;


        lastEl.textContent =
          "Повтор: " +
          (
            r.serial ||
            serial
          );


        setStatus(
          "⚠️ ПОВТОР<br>" +
          "<b>" +
          esc(
            r.serial ||
            serial
          ) +
          "</b><br>" +
          "<small>" +
          esc(
            r.message || ""
          ) +
          "</small>",
          "duplicate"
        );


        beep(false);


        setTimeout(
          function() {

            processing = false;

            setStatus(
              "Наведите на следующий QR-код",
              "info"
            );

          },
          1000
        );


        return;

      }


      /* -----------------------------------------------
         ЛИМИТ
      ------------------------------------------------ */

      if (
        r &&
        r.limitReached
      ) {

        count =
          Number(
            r.count ||
            MAX_PER_SESSION
          );


        countEl.textContent =
          count;

        remainingEl.textContent =
          "0";


        beep(false);

        processing = false;

        showLimit();

        return;

      }


      /* -----------------------------------------------
         ОШИБКА
      ------------------------------------------------ */

      setStatus(
        "❌ Ошибка<br>" +
        "<small>" +
        esc(
          (r && r.message) ||
          "Неизвестная ошибка"
        ) +
        "</small>",
        "error"
      );


      beep(false);

      processing = false;

    }

  );

}


/* =========================================================
   LIMIT
========================================================= */

function showLimit() {

  stopScanner();

  setStatus(
    "🛑 ЛИМИТ ДОСТИГНУТ<br>" +
    "<b>" +
    count +
    " / " +
    MAX_PER_SESSION +
    "</b><br>" +
    "<small>Завершите текущий сеанс.</small>",
    "warning"
  );

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  scanner
    .stop()
    .then(
      function() {

        scanning = false;

        try {
          scanner.clear();
        } catch (e) {}

      }
    )
    .catch(
      function() {

        scanning = false;

      }
    );

}


/* =========================================================
   CLOSE
========================================================= */

function closeSession() {

  stopScanner();

  scanning = false;

  processing = false;


  executor = "";

  du = "";

  count = 0;

  dupes = 0;

  lastSerial = "";

  lastScanTime = 0;


  countEl.textContent =
    "0";

  limitEl.textContent =
    MAX_PER_SESSION;

  remainingEl.textContent =
    MAX_PER_SESSION;

  dateEl.textContent =
    "—";

  lastEl.textContent =
    "Последний номер: —";


  sessionBlock.classList.add(
    "hidden"
  );

  setupBlock.classList.remove(
    "hidden"
  );


  setStatus(
    "Введите данные для нового сканирования.",
    "info"
  );

}


/* =========================================================
   DATE
========================================================= */

function getToday() {

  const now =
    new Date();

  const parts =
    new Intl.DateTimeFormat(
      "ru-RU",
      {
        timeZone:
          "Asia/Tashkent",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    ).formatToParts(now);


  let day = "";
  let month = "";
  let year = "";


  parts.forEach(
    function(part) {

      if (
        part.type === "day"
      ) {

        day = part.value;

      }

      if (
        part.type === "month"
      ) {

        month = part.value;

      }

      if (
        part.type === "year"
      ) {

        year = part.value;

      }

    }
  );


  return (
    day +
    "." +
    month +
    "." +
    year
  );

}

</script>
