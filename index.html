<!doctype html>
<html lang="ru">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color"
      content="#1976d2">

<title>Сканер серийных номеров</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f2f4f7;
  color: #1f2937;
}

.app {
  max-width: 620px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 7px 0 14px;
}


/* PIN */

.pin-screen {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;
}

.pin-box {

  width: min(92vw, 420px);

  background: #fff;

  border-radius: 18px;

  padding: 28px;

  box-shadow:
    0 4px 24px rgba(0,0,0,.10);

  text-align: center;
}

.pin-title {

  font-size: 23px;

  font-weight: 700;

  margin-bottom: 8px;
}

.pin-subtitle {

  color: #6b7280;

  margin-bottom: 18px;
}

.pin-input {

  width: 100%;

  padding: 15px;

  border:
    1px solid #d1d5db;

  border-radius: 12px;

  font-size: 24px;

  text-align: center;

  letter-spacing: 5px;

  outline: none;
}

.pin-input:focus {

  border-color: #1976d2;
}

.pin-button {

  margin-top: 12px;
}

.pin-error {

  min-height: 22px;

  margin-top: 10px;

  color: #b42318;

  font-size: 14px;
}


/* executor */

.setup-box {

  background: #fff;

  border-radius: 16px;

  padding: 20px;

  margin-bottom: 12px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.05);
}

label {

  display: block;

  font-weight: 600;

  margin-bottom: 7px;
}

input,
select {

  width: 100%;

  padding: 14px;

  border:
    1px solid #d1d5db;

  border-radius: 12px;

  font-size: 17px;

  background: #fff;
}

select {

  margin-bottom: 12px;
}


/* scanner */

#reader {

  width: 100%;

  background: #000;

  border-radius: 14px;

  overflow: hidden;
}


/* status */

.status {

  margin-top: 12px;

  padding: 17px;

  border-radius: 14px;

  background: #fff;

  text-align: center;

  font-size: 19px;

  line-height: 1.35;

  min-height: 78px;

  display: flex;

  align-items: center;

  justify-content: center;
}

.success {

  background: #e8f7ed;

  color: #137333;

  font-weight: 700;
}

.duplicate {

  background: #fff4d6;

  color: #8a5a00;

  font-weight: 700;
}

.error {

  background: #fdeaea;

  color: #b42318;

  font-weight: 700;
}

.info {

  color: #374151;
}


/* buttons */

button {

  width: 100%;

  margin-top: 12px;

  padding: 15px;

  border: 0;

  border-radius: 12px;

  font-size: 18px;

  font-weight: 600;

  background: #1976d2;

  color: #fff;
}

button:disabled {

  opacity: .55;
}

.secondary {

  background: #6b7280;
}


/* stats */

.stats {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 12px;
}

.card {

  background: #fff;

  border-radius: 12px;

  padding: 13px;

  text-align: center;
}

.card .num {

  display: block;

  font-size: 25px;

  font-weight: 700;

  margin-top: 3px;
}

.last {

  margin-top: 10px;

  padding: 12px;

  background: #fff;

  border-radius: 12px;

  text-align: center;

  font-size: 18px;

  font-weight: 700;

  word-break: break-word;
}

.info-panel {

  margin-top: 10px;

  padding: 12px;

  background: #fff;

  border-radius: 12px;

  text-align: center;

  font-size: 15px;

  color: #4b5563;
}

.limit {

  color: #b42318;

  font-weight: 700;
}

.hint {

  margin-top: 10px;

  text-align: center;

  color: #6b7280;

  font-size: 13px;
}

.hidden {

  display: none !important;
}

</style>

</head>


<body>


<!-- PIN -->

<div id="pinScreen"
     class="pin-screen">

  <div class="pin-box">

    <div class="pin-title">
      🔐 Доступ к сканеру
    </div>

    <div class="pin-subtitle">
      Введите PIN-код
    </div>

    <input
      id="pinInput"
      class="pin-input"
      type="password"
      inputmode="numeric"
      maxlength="8"
      autocomplete="off"
      placeholder="••••••••">

    <button
      class="pin-button"
      onclick="checkPin()">
      Войти
    </button>

    <div
      id="pinError"
      class="pin-error">
    </div>

  </div>

</div>


<!-- SETUP -->

<div
  id="setupApp"
  class="app hidden">

  <h1>
    Сканер серийных номеров
  </h1>

  <div class="setup-box">

    <label for="executor">
      Имя и фамилия исполнителя
    </label>

    <input
      id="executor"
      type="text"
      autocomplete="name"
      placeholder="Например: Иван Иванов">

    <br><br>

    <label for="du">
      ДУ прибора
    </label>

    <select id="du">

      <option value="">
        — Выберите ДУ —
      </option>

      <option>DN15 Modbus</option>
      <option>DN15 LoraWan</option>
      <option>DN20 Modbus</option>
      <option>DN20 LoraWan</option>
      <option>DN25 BR</option>
      <option>DN32 BR</option>
      <option>DN40 BR</option>
      <option>DN50 BR</option>
      <option>DN50 CLI</option>
      <option>DN80 CLI</option>
      <option>DN100 CLI</option>
      <option>DN150 CLI</option>
      <option>DN200 CLI</option>

    </select>

    <button
      id="sessionBtn"
      onclick="startSession()">

      ▶ Начать сеанс

    </button>

    <div
      id="setupStatus"
      class="status info hidden">
    </div>

  </div>

</div>


<!-- SCANNER -->

<div
  id="scannerApp"
  class="app hidden">

  <h1>
    Сканирование
  </h1>

  <div class="info-panel">

    <b id="executorView"></b>

    <br>

    ДУ:
    <b id="duView"></b>

    <br>

    Дата:
    <b id="dateView"></b>

    <br>

    Сеанс №
    <b id="sessionView"></b>

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status info">

    Нажмите «Начать камеру»
    и разрешите доступ к камере.

  </div>


  <button
    id="startBtn"
    onclick="startScanner()">

    📷 Начать камеру

  </button>


  <div class="stats">

    <div class="card">

      Добавлено

      <span
        class="num"
        id="count">
        0
      </span>

    </div>

    <div class="card">

      Повторов

      <span
        class="num"
        id="dupes">
        0
      </span>

    </div>

  </div>


  <div
    class="info-panel">

    Лимит:

    <b id="limitView">
      150
    </b>

    <br>

    Осталось:

    <b id="remainingView">
      150
    </b>

  </div>


  <div
    class="last"
    id="last">

    Последний номер: —

  </div>


  <button
    id="closeSessionBtn"
    class="secondary"
    onclick="closeSession()">

    ⏹ Закрыть сеанс

  </button>


  <div class="hint">

    Дубликаты не записываются.
    Максимум 150 уникальных кодов за один сеанс.

  </div>

</div>


<script>


/* =========================
   НАСТРОЙКИ
========================= */

const PIN = "77777777";

const API_URL =
"https://script.google.com/macros/s/AKfycbxiZia7qBQmlgRQTm9eRX7qmRmczYimSoltss3URIbodkp5ZGPLO-Htl_7pVqAaqPPUaA/exec";


/* =========================
   ПЕРЕМЕННЫЕ
========================= */

let scanner = null;

let scanning = false;

let processing = false;

let count = 0;

let dupes = 0;

let lastAcceptedSerial = "";

let lastAcceptedAt = 0;

let audioContext = null;

let executor = "";

let du = "";

let session = 0;

let sessionDate = "";

let maxPerSession = 150;


/* =========================
   DOM
========================= */

const statusEl =
  document.getElementById("status");

const startBtn =
  document.getElementById("startBtn");

const countEl =
  document.getElementById("count");

const dupesEl =
  document.getElementById("dupes");

const lastEl =
  document.getElementById("last");

const remainingEl =
  document.getElementById("remainingView");


/* =========================
   PIN
========================= */

function checkPin() {

  const input =
    document.getElementById("pinInput");

  const error =
    document.getElementById("pinError");


  if (input.value === PIN) {

    document
      .getElementById("pinScreen")
      .classList.add("hidden");

    document
      .getElementById("setupApp")
      .classList.remove("hidden");

    error.textContent = "";

    input.value = "";

    document
      .getElementById("executor")
      .focus();

  } else {

    error.textContent =
      "Неверный PIN-код";

    input.value = "";

    input.focus();

  }

}


document
  .getElementById("pinInput")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter") {

        checkPin();

      }

    }
  );


/* =========================
   УТИЛИТЫ
========================= */

function esc(v) {

  return String(v)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


function setStatus(html, cls) {

  statusEl.className =
    "status " + cls;

  statusEl.innerHTML = html;

}


function extractSerial(text) {

  const raw =
    String(text || "")
      .trim()
      .replace(/\s+/g, " ");


  const m =
    raw.match(
      /\bSN\s*[:#-]?\s*([A-Za-z0-9_-]+)/i
    );


  if (m) {

    return "SN " + m[1];

  }


  return raw;

}


/* =========================
   ЗВУК
========================= */

function beep(ok) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );


    osc.frequency.value =
      ok ? 880 : 330;

    osc.type = "sine";


    const now =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      .001,
      now
    );


    gain.gain
      .exponentialRampToValueAtTime(
        .18,
        now + .01
      );


    gain.gain
      .exponentialRampToValueAtTime(
        .001,
        now + (ok ? .13 : .25)
      );


    osc.start(now);

    osc.stop(
      now + (ok ? .14 : .26)
    );

  } catch (e) {}

}


/* =========================
   СТАРТ СЕАНСА
========================= */

function startSession() {

  const executorInput =
    document.getElementById("executor");

  const duInput =
    document.getElementById("du");

  const btn =
    document.getElementById("sessionBtn");

  const setupStatus =
    document.getElementById("setupStatus");


  executor =
    executorInput.value.trim();

  du =
    duInput.value;


  if (!executor) {

    setupStatus.className =
      "status error";

    setupStatus.textContent =
      "Введите имя и фамилию исполнителя.";

    setupStatus.classList.remove(
      "hidden"
    );

    return;

  }


  if (!du) {

    setupStatus.className =
      "status error";

    setupStatus.textContent =
      "Выберите ДУ прибора.";

    setupStatus.classList.remove(
      "hidden"
    );

    return;

  }


  btn.disabled = true;

  setupStatus.className =
    "status info";

  setupStatus.textContent =
    "⏳ Создаём новый сеанс…";

  setupStatus.classList.remove(
    "hidden"
  );


  jsonp(
    "startSession",
    {
      executor: executor,
      du: du
    },
    function(r) {

      btn.disabled = false;


      if (!r || !r.success) {

        setupStatus.className =
          "status error";

        setupStatus.innerHTML =
          "❌ Ошибка<br>" +
          "<small>" +
          esc(
            r && r.message
              ? r.message
              : "Нет ответа"
          ) +
          "</small>";

        return;

      }


      sessionDate =
        r.date;

      session =
        Number(r.session);

      maxPerSession =
        Number(r.max || 150);

      count = 0;

      dupes = 0;


      countEl.textContent =
        "0";

      dupesEl.textContent =
        "0";

      remainingEl.textContent =
        maxPerSession;


      document
        .getElementById("executorView")
        .textContent =
        executor;

      document
        .getElementById("duView")
        .textContent =
        du;

      document
        .getElementById("dateView")
        .textContent =
        sessionDate;

      document
        .getElementById("sessionView")
        .textContent =
        session;

      document
        .getElementById("limitView")
        .textContent =
        maxPerSession;


      document
        .getElementById("setupApp")
        .classList.add("hidden");

      document
        .getElementById("scannerApp")
        .classList.remove("hidden");


      setStatus(
        "Нажмите «Начать камеру»",
        "info"
      );

    }
  );

}


/* =========================
   КАМЕРА
========================= */

function startScanner() {

  if (scanning) return;


  startBtn.disabled = true;

  processing = false;


  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  } catch (e) {}


  setStatus(
    "Запрашиваем доступ к камере…",
    "info"
  );


  scanner =
    new Html5Qrcode("reader");

  scanning = true;


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: function(w, h) {

        const s =
          Math.floor(
            Math.min(w, h) * .68
          );

        return {

          width:
            Math.max(180, s),

          height:
            Math.max(180, s)

        };

      },

      aspectRatio: 1

    },

    onScanSuccess,

    function() {}

  )

  .then(function() {

    setStatus(
      "Наведите камеру на QR-код",
      "info"
    );

  })

  .catch(function(e) {

    scanning = false;

    startBtn.disabled = false;

    setStatus(
      "❌ Не удалось открыть камеру<br>" +
      "<small>" +
      esc(e) +
      "</small>",
      "error"
    );

  });

}


/* =========================
   СКАНИРОВАНИЕ
========================= */

function onScanSuccess(decodedText) {

  if (processing) return;


  if (count >= maxPerSession) {

    setStatus(
      "🛑 ЛИМИТ 150 КОДОВ ДОСТИГНУТ",
      "error"
    );

    return;

  }


  const serial =
    extractSerial(decodedText);


  if (!serial) return;


  const now =
    Date.now();


  if (
    serial === lastAcceptedSerial &&
    (now - lastAcceptedAt) < 3000
  ) {

    return;

  }


  processing = true;

  lastAcceptedSerial =
    serial;

  lastAcceptedAt =
    now;


  setStatus(
    "⏳ Сохраняем<br><b>" +
    esc(serial) +
    "</b>",
    "info"
  );


  saveSerial(serial);

}


/* =========================
   СОХРАНЕНИЕ
========================= */

function saveSerial(serial) {

  jsonp(

    "save",

    {

      serial: serial,

      executor: executor,

      du: du,

      session: session

    },

    function(r) {

      if (!r) {

        processing = false;

        setStatus(
          "❌ Нет ответа от Google Sheets.<br>" +
          "Проверьте интернет.",
          "error"
        );

        beep(false);

        return;

      }


      /* SUCCESS */

      if (r.success) {

        count =
          Number(r.count || count + 1);

        countEl.textContent =
          count;

        remainingEl.textContent =
          Math.max(
            0,
            maxPerSession - count
          );


        lastEl.textContent =
          "Последний номер: " +
          r.serial;


        setStatus(

          "🟢 ДОБАВЛЕНО<br>" +
          "<b>" +
          esc(r.serial) +
          "</b>",

          "success"

        );


        beep(true);


        if (
          count >=
          maxPerSession
        ) {

          setTimeout(function() {

            setStatus(
              "🛑 ЛИМИТ 150 КОДОВ ДОСТИГНУТ<br>" +
              "Закройте сеанс.",
              "error"
            );

            processing = false;

          }, 700);

        } else {

          setTimeout(function() {

            processing = false;

            setStatus(
              "Наведите на следующий QR-код",
              "info"
            );

          }, 600);

        }


        return;

      }


      /* DUPLICATE */

      if (r.duplicate) {

        dupes++;

        dupesEl.textContent =
          dupes;


        lastEl.textContent =
          "Повтор: " +
          r.serial;


        setStatus(

          "⚠️ УЖЕ ЕСТЬ В ТАБЛИЦЕ<br>" +
          "<b>" +
          esc(r.serial) +
          "</b><br>" +
          "<small>" +
          esc(r.message || "") +
          "</small>",

          "duplicate"

        );


        beep(false);


        setTimeout(function() {

          processing = false;

          setStatus(
            "Наведите на следующий QR-код",
            "info"
          );

        }, 1300);


        return;

      }


      /* LIMIT */

      if (r.limitReached) {

        count =
          Number(r.count || count);

        countEl.textContent =
          count;

        remainingEl.textContent =
          "0";


        setStatus(

          "🛑 ЛИМИТ ДОСТИГНУТ<br>" +
          "<b>" +
          esc(r.message) +
          "</b>",

          "error"

        );


        beep(false);

        processing = false;

        return;

      }


      /* OTHER ERROR */

      setStatus(

        "❌ Ошибка<br>" +
        "<small>" +
        esc(
          r.message ||
          "Неизвестная ошибка"
        ) +
        "</small>",

        "error"

      );


      beep(false);

      processing = false;

    }

  );

}


/* =========================
   JSONP
========================= */

function jsonp(action, params, callback) {

  const cb =
    "qrCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  const query =
    new URLSearchParams();


  query.set(
    "action",
    action
  );


  query.set(
    "callback",
    cb
  );


  Object.keys(params)
    .forEach(function(key) {

      query.set(
        key,
        params[key]
      );

    });


  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      cleanup();

      callback({

        success: false,

        message:
          "Нет ответа от Google Sheets"

      });

    }, 15000);


  window[cb] =
    function(data) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      cleanup();

      callback(data);

    };


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      cleanup();

      callback({

        success: false,

        message:
          "Не удалось связаться с Google Sheets"

      });

    };


  script.src =
    API_URL +
    "?" +
    query.toString();


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[cb];

    if (script.parentNode) {

      script.parentNode
        .removeChild(script);

    }

  }

}


/* =========================
   ЗАКРЫТИЕ СЕАНСА
========================= */

function closeSession() {

  if (scanning && scanner) {

    scanner
      .stop()
      .catch(function() {})
      .finally(function() {

        scanning = false;

      });

  }


  processing = false;


  document
    .getElementById("scannerApp")
    .classList.add("hidden");


  document
    .getElementById("setupApp")
    .classList.remove("hidden");


  document
    .getElementById("setupStatus")
    .className =
    "status success";


  document
    .getElementById("setupStatus")
    .textContent =
    "Сеанс №" +
    session +
    " закрыт. Можно начать следующий.";

  document
    .getElementById("setupStatus")
    .classList.remove(
      "hidden"
    );


  document
    .getElementById("sessionBtn")
    .disabled = false;

}

</script>

</body>

</html>
