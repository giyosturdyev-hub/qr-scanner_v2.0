<!doctype html>
<html lang="ru">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#1976d2"
>

<title>Сканер серийных номеров</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript"
></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f2f4f7;

  color: #1f2937;

}


.app {

  max-width: 620px;

  margin: auto;

}


h1 {

  text-align: center;

  font-size: 25px;

  margin: 7px 0 18px;

}


/* PIN */

.pin-screen {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

}


.pin-box {

  width: min(92vw, 420px);

  background: #fff;

  border-radius: 18px;

  padding: 28px;

  box-shadow:
    0 4px 24px rgba(0,0,0,.10);

  text-align: center;

}


.pin-title {

  font-size: 23px;

  font-weight: 700;

  margin-bottom: 8px;

}


.pin-subtitle {

  color: #6b7280;

  margin-bottom: 18px;

}


.pin-input {

  width: 100%;

  padding: 15px;

  border:
    1px solid #d1d5db;

  border-radius: 12px;

  font-size: 24px;

  text-align: center;

  letter-spacing: 5px;

  outline: none;

}


.pin-input:focus {

  border-color: #1976d2;

}


.pin-error {

  min-height: 22px;

  margin-top: 10px;

  color: #b42318;

  font-size: 14px;

}


/* FORM */

.setup {

  background: #fff;

  padding: 16px;

  border-radius: 14px;

  margin-bottom: 14px;

}


.field {

  margin-bottom: 14px;

}


.field:last-child {

  margin-bottom: 0;

}


label {

  display: block;

  margin-bottom: 7px;

  font-weight: 600;

}


input,
select {

  width: 100%;

  padding: 14px;

  border:
    1px solid #d1d5db;

  border-radius: 12px;

  font-size: 17px;

  background: #fff;

  outline: none;

}


input:focus,
select:focus {

  border-color: #1976d2;

}


/* CAMERA */

#reader {

  width: 100%;

  background: #000;

  border-radius: 14px;

  overflow: hidden;

}


.status {

  margin-top: 12px;

  padding: 17px;

  border-radius: 14px;

  background: #fff;

  text-align: center;

  font-size: 18px;

  line-height: 1.4;

  min-height: 78px;

  display: flex;

  align-items: center;

  justify-content: center;

}


.success {

  background: #e8f7ed;

  color: #137333;

  font-weight: 700;

}


.duplicate {

  background: #fff4d6;

  color: #8a5a00;

  font-weight: 700;

}


.error {

  background: #fdeaea;

  color: #b42318;

  font-weight: 700;

}


.info {

  color: #374151;

}


/* BUTTONS */

button {

  width: 100%;

  margin-top: 12px;

  padding: 15px;

  border: 0;

  border-radius: 12px;

  font-size: 18px;

  font-weight: 600;

  background: #1976d2;

  color: #fff;

  cursor: pointer;

}


button:disabled {

  opacity: .55;

  cursor: not-allowed;

}


.danger {

  background: #b42318;

}


/* STATS */

.stats {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 12px;

}


.card {

  background: #fff;

  border-radius: 12px;

  padding: 13px;

  text-align: center;

}


.card .num {

  display: block;

  font-size: 30px;

  font-weight: 700;

  margin-top: 3px;

}


/* LAST */

.last {

  margin-top: 10px;

  padding: 12px;

  background: #fff;

  border-radius: 12px;

  text-align: center;

  font-size: 17px;

  font-weight: 700;

  word-break: break-word;

}


/* HINT */

.hint {

  margin-top: 10px;

  text-align: center;

  color: #6b7280;

  font-size: 13px;

}


.hidden {

  display: none !important;

}

</style>

</head>


<body>


<!-- =====================================================
     PIN
===================================================== -->

<div
  id="pinScreen"
  class="pin-screen"
>

  <div class="pin-box">

    <div class="pin-title">
      🔐 Доступ к сканеру
    </div>

    <div class="pin-subtitle">
      Введите PIN-код
    </div>

    <input
      id="pinInput"
      class="pin-input"
      type="password"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
      placeholder="•••••"
    >

    <button
      onclick="checkPin()"
    >
      Войти
    </button>

    <div
      id="pinError"
      class="pin-error"
    ></div>

  </div>

</div>


<!-- =====================================================
     APPLICATION
===================================================== -->

<div
  id="scannerApp"
  class="app hidden"
>

  <h1>
    Сканер серийных номеров
  </h1>


  <!-- SETUP -->

  <div
    id="setupBlock"
    class="setup"
  >

    <div class="field">

      <label for="executor">
        ФИО исполнителя
      </label>

      <input
        id="executor"
        type="text"
        autocomplete="name"
        placeholder="Например: Иван Иванов"
      >

    </div>


    <div class="field">

      <label for="du">
        ДУ прибора
      </label>

      <select id="du">

        <option value="">
          — Выберите ДУ —
        </option>

        <option value="DN15 Modbus">
          DN15 Modbus
        </option>

        <option value="DN15 LoraWan">
          DN15 LoraWan
        </option>

        <option value="DN20 Modbus">
          DN20 Modbus
        </option>

        <option value="DN20 LoraWan">
          DN20 LoraWan
        </option>

        <option value="DN25 BR">
          DN25 BR
        </option>

        <option value="DN32 BR">
          DN32 BR
        </option>

        <option value="DN40 BR">
          DN40 BR
        </option>

        <option value="DN50 BR">
          DN50 BR
        </option>

        <option value="DN50 CLI">
          DN50 CLI
        </option>

        <option value="DN80 CLI">
          DN80 CLI
        </option>

        <option value="DN100 CLI">
          DN100 CLI
        </option>

        <option value="DN150 CLI">
          DN150 CLI
        </option>

        <option value="DN200 CLI">
          DN200 CLI
        </option>

      </select>

    </div>


    <button
      id="startButton"
      onclick="startScanning()"
    >
      📷 Начать сканирование
    </button>

  </div>


  <!-- SCANNER -->

  <div
    id="scannerBlock"
    class="hidden"
  >

    <div id="reader"></div>


    <div
      id="status"
      class="status info"
    >
      Наведите камеру на QR-код
    </div>


    <div class="stats">

      <div class="card">

        Отсканировано

        <span
          id="count"
          class="num"
        >
          0
        </span>

      </div>


      <div class="card">

        Повторов

        <span
          id="duplicates"
          class="num"
        >
          0
        </span>

      </div>

    </div>


    <div
      id="last"
      class="last"
    >
      Последний номер: —
    </div>


    <button
      id="stopButton"
      class="danger"
      onclick="stopScanning()"
    >
      ⏹ Остановить сканирование
    </button>


    <div class="hint">

      Каждый уникальный QR записывается
      в Google Sheets.

      Повторные QR не записываются.

    </div>

  </div>

</div>


<script>


/* =====================================================
   НАСТРОЙКИ
===================================================== */

const PIN = "77777";


const API_URL =
  "https://script.google.com/macros/s/AKfycbxiZia7qBQmlgRQTm9eRX7qmRmczYimSoltss3URIbodkp5ZGPLO-Htl_7pVqAaqPPUaA/exec";


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let scanner = null;

let scanning = false;

let processing = false;

let count = 0;

let duplicates = 0;

let lastSerial = "";

let lastScanTime = 0;

let audioContext = null;


let currentExecutor = "";

let currentDu = "";


/* =====================================================
   ELEMENTS
===================================================== */

const pinScreen =
  document.getElementById("pinScreen");


const scannerApp =
  document.getElementById("scannerApp");


const pinInput =
  document.getElementById("pinInput");


const pinError =
  document.getElementById("pinError");


const executorInput =
  document.getElementById("executor");


const duSelect =
  document.getElementById("du");


const setupBlock =
  document.getElementById("setupBlock");


const scannerBlock =
  document.getElementById("scannerBlock");


const statusEl =
  document.getElementById("status");


const countEl =
  document.getElementById("count");


const duplicatesEl =
  document.getElementById("duplicates");


const lastEl =
  document.getElementById("last");


/* =====================================================
   PIN
===================================================== */

function checkPin() {

  const pin =
    pinInput.value.trim();


  if (pin === PIN) {

    pinScreen.classList.add("hidden");

    scannerApp.classList.remove("hidden");

    pinError.textContent = "";

    pinInput.value = "";

    executorInput.focus();

  } else {

    pinError.textContent =
      "Неверный PIN-код.";

    pinInput.value = "";

    pinInput.focus();

  }

}


pinInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      checkPin();

    }

  }
);


/* =====================================================
   SAFE HTML
===================================================== */

function esc(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  className
) {

  statusEl.className =
    "status " +
    className;

  statusEl.innerHTML =
    text;

}


/* =====================================================
   QR TEXT
===================================================== */

function extractSerial(text) {

  const serial =
    String(text || "")
      .trim();


  if (!serial) {

    return "";

  }


  /*
   * QR содержит только серийный номер.
   *
   * Поэтому НЕ пытаемся искать SN,
   * Serial Number и т.д.
   *
   * Берём содержимое QR целиком.
   */

  return serial;

}


/* =====================================================
   SOUND
===================================================== */

function beep(success) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      success
        ? 880
        : 330;


    oscillator.type =
      "sine";


    const now =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      0.001,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      0.18,
      now + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now +
      (
        success
          ? 0.13
          : 0.25
      )
    );


    oscillator.start(now);


    oscillator.stop(
      now +
      (
        success
          ? 0.14
          : 0.26
      )
    );

  } catch (error) {}

}


/* =====================================================
   START SCANNING
===================================================== */

function startScanning() {

  const executor =
    executorInput.value.trim();


  const du =
    duSelect.value.trim();


  if (!executor) {

    alert(
      "Введите ФИО исполнителя."
    );

    executorInput.focus();

    return;

  }


  if (!du) {

    alert(
      "Выберите ДУ прибора."
    );

    duSelect.focus();

    return;

  }


  currentExecutor =
    executor;


  currentDu =
    du;


  count = 0;

  duplicates = 0;

  lastSerial = "";

  lastScanTime = 0;


  countEl.textContent =
    "0";


  duplicatesEl.textContent =
    "0";


  lastEl.textContent =
    "Последний номер: —";


  setupBlock.classList.add(
    "hidden"
  );


  scannerBlock.classList.remove(
    "hidden"
  );


  setStatus(
    "Запрашиваем доступ к камере…",
    "info"
  );


  processing = false;


  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  } catch (error) {}


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width:
              Math.max(
                180,
                size
              ),

            height:
              Math.max(
                180,
                size
              )

          };

        }

      },

      onScanSuccess,

      function(errorMessage) {

        /*
         * html5-qrcode постоянно
         * сообщает ошибки поиска QR.
         *
         * Здесь ничего делать не нужно.
         */

      }

    )

    .then(function() {

      scanning = true;

      setStatus(
        "Наведите камеру на QR-код",
        "info"
      );

    })

    .catch(function(error) {

      scanning = false;

      setStatus(
        "❌ Не удалось открыть камеру.<br>" +
        "<small>" +
        esc(error) +
        "</small>",
        "error"
      );

      setupBlock.classList.remove(
        "hidden"
      );

      scannerBlock.classList.add(
        "hidden"
      );

    });

}


/* =====================================================
   QR FOUND
===================================================== */

function onScanSuccess(
  decodedText
) {

  if (processing) {

    return;

  }


  const serial =
    extractSerial(
      decodedText
    );


  if (!serial) {

    return;

  }


  const now =
    Date.now();


  /*
   * Защита от одного QR,
   * который камера может распознать
   * несколько раз подряд.
   */

  if (

    serial === lastSerial &&

    now - lastScanTime < 2500

  ) {

    return;

  }


  processing = true;

  lastSerial = serial;

  lastScanTime = now;


  setStatus(
    "⏳ Сохраняем...<br><b>" +
    esc(serial) +
    "</b>",
    "info"
  );


  saveSerial(serial);

}


/* =====================================================
   SAVE
===================================================== */

function saveSerial(serial) {

  callApi(

    "save",

    {

      serial:
        serial,

      executor:
        currentExecutor,

      du:
        currentDu

    },

    function(result) {


      /* =================================================
         SUCCESS
      ================================================= */

      if (
        result &&
        result.success
      ) {

        count =
          Number(
            result.count || 0
          );


        countEl.textContent =
          count;


        lastEl.textContent =
          "Последний номер: " +
          result.serial;


        setStatus(
          "🟢 ДОБАВЛЕНО<br><b>" +
          esc(result.serial) +
          "</b>",
          "success"
        );


        beep(true);


        setTimeout(
          function() {

            processing = false;


            setStatus(
              "Наведите камеру на следующий QR-код",
              "info"
            );

          },
          700
        );


        return;

      }


      /* =================================================
         DUPLICATE
      ================================================= */

      if (
        result &&
        result.duplicate
      ) {

        duplicates++;

        duplicatesEl.textContent =
          duplicates;


        lastEl.textContent =
          "Повтор: " +
          (
            result.serial ||
            serial
          );


        setStatus(
          "⚠️ ПОВТОР<br><b>" +
          esc(
            result.serial ||
            serial
          ) +
          "</b>",
          "duplicate"
        );


        beep(false);


        setTimeout(
          function() {

            processing = false;


            setStatus(
              "Наведите камеру на следующий QR-код",
              "info"
            );

          },
          1000
        );


        return;

      }


      /* =================================================
         ERROR
      ================================================= */

      setStatus(
        "❌ Ошибка<br><small>" +
        esc(
          (
            result &&
            result.message
          ) ||
          "Неизвестная ошибка"
        ) +
        "</small>",
        "error"
      );


      beep(false);


      processing = false;

    }

  );

}


/* =====================================================
   API
===================================================== */

function callApi(
  action,
  params,
  callback
) {

  const callbackName =
    "qrCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let finished = false;


  const timeout =
    setTimeout(
      function() {

        if (finished) {

          return;

        }


        finished = true;

        cleanup();


        callback({

          success: false,

          message:
            "Нет ответа от Google Apps Script."

        });

      },
      15000
    );


  window[callbackName] =
    function(result) {

      if (finished) {

        return;

      }


      finished = true;

      clearTimeout(timeout);

      cleanup();

      callback(result);

    };


  script.onerror =
    function() {

      if (finished) {

        return;

      }


      finished = true;

      clearTimeout(timeout);

      cleanup();


      callback({

        success: false,

        message:
          "Не удалось связаться с Google Apps Script."

      });

    };


  let url =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          params[key]
        );

    }
  );


  script.src =
    url;


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


/* =====================================================
   STOP SCANNING
===================================================== */

function stopScanning() {

  if (
    scanner &&
    scanning
  ) {

    scanner
      .stop()
      .then(function() {

        scanning = false;


        try {

          scanner.clear();

        } catch (error) {}

      })
      .catch(function() {

        scanning = false;

      });

  }


  setupBlock.classList.remove(
    "hidden"
  );


  scannerBlock.classList.add(
    "hidden"
  );


  processing = false;

}

</script>

</body>

</html>
