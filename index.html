<!doctype html>

<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1976d2"
  >

  <title>
    Сканер серийных номеров
  </title>


  <!-- Библиотека QR-сканера -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 16px;

      background: #f2f4f7;

      color: #1f2937;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    }


    .app {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

    }


    h1 {

      text-align: center;

      font-size: 24px;

      margin:
        8px 0 18px;

    }


    .hidden {
      display: none !important;
    }


    /* =====================================================
       PIN
    ====================================================== */

    .pin-screen {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .pin-box {

      width: min(92vw, 420px);

      background: #ffffff;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 4px 24px
        rgba(0,0,0,.10);

      text-align: center;

    }


    .pin-title {

      font-size: 23px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    .pin-subtitle {

      color: #6b7280;

      margin-bottom: 18px;

    }


    .pin-input {

      width: 100%;

      padding: 15px;

      border:
        1px solid #d1d5db;

      border-radius: 12px;

      font-size: 24px;

      text-align: center;

      letter-spacing: 5px;

      outline: none;

    }


    /* =====================================================
       FORM
    ====================================================== */

    .setup {

      background: #ffffff;

      padding: 16px;

      border-radius: 14px;

      margin-bottom: 14px;

    }


    .field {

      margin-bottom: 15px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-weight: 600;

    }


    input,
    select {

      width: 100%;

      padding: 14px;

      border:
        1px solid #d1d5db;

      border-radius: 12px;

      font-size: 17px;

      background: #ffffff;

      outline: none;

    }


    button {

      width: 100%;

      margin-top: 12px;

      padding: 15px;

      border: 0;

      border-radius: 12px;

      font-size: 18px;

      font-weight: 600;

      background: #1976d2;

      color: #ffffff;

      cursor: pointer;

    }


    button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    /* =====================================================
       INFO
    ====================================================== */

    .info-box {

      margin-bottom: 12px;

      padding: 12px;

      background: #ffffff;

      border-radius: 12px;

      text-align: center;

      line-height: 1.5;

    }


    .info-box strong {

      font-size: 16px;

    }


    /* =====================================================
       CAMERA
    ====================================================== */

    #reader {

      width: 100%;

      background: #000000;

      border-radius: 14px;

      overflow: hidden;

    }


    /* =====================================================
       STATUS
    ====================================================== */

    .status {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background: #ffffff;

      text-align: center;

      font-size: 18px;

      line-height: 1.4;

      min-height: 68px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .info {

      color: #374151;

    }


    .success {

      background: #e8f7ed;

      color: #137333;

      font-weight: 700;

    }


    .error {

      background: #fdeaea;

      color: #b42318;

      font-weight: 700;

    }


    .duplicate {

      background: #fff4d6;

      color: #8a5a00;

      font-weight: 700;

    }


    /* =====================================================
       COUNTER
    ====================================================== */

    .counter {

      margin-top: 12px;

      padding: 18px;

      background: #ffffff;

      border-radius: 14px;

      text-align: center;

    }


    .counter-title {

      color: #6b7280;

      font-size: 15px;

    }


    .counter-number {

      display: block;

      margin-top: 4px;

      font-size: 42px;

      font-weight: 700;

    }


    /* =====================================================
       LAST
    ====================================================== */

    .last {

      margin-top: 12px;

      padding: 14px;

      background: #ffffff;

      border-radius: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 600;

      word-break: break-word;

    }


    /* =====================================================
       STOP
    ====================================================== */

    .stop-button {

      background: #b42318;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       PIN SCREEN
  ====================================================== -->

  <div
    id="pinScreen"
    class="pin-screen"
  >

    <div class="pin-box">

      <div class="pin-title">
        🔐 Доступ к сканеру
      </div>

      <div class="pin-subtitle">
        Введите PIN-код
      </div>

      <input
        id="pinInput"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="5"
        autocomplete="off"
        placeholder="•••••"
      >

      <button
        id="pinButton"
        onclick="checkPin()"
      >
        Войти
      </button>

      <div
        id="pinError"
        style="
          min-height:22px;
          margin-top:10px;
          color:#b42318;
        "
      ></div>

    </div>

  </div>


  <!-- =====================================================
       MAIN APPLICATION
  ====================================================== -->

  <div
    id="app"
    class="app hidden"
  >

    <h1>
      Сканер серийных номеров
    </h1>


    <!-- ===================================================
         НАСТРОЙКИ
    ==================================================== -->

    <div
      id="setup"
      class="setup"
    >

      <!-- ФИО -->

      <div class="field">

        <label for="executor">
          ФИО исполнителя
        </label>

        <input
          id="executor"
          type="text"
          autocomplete="name"
          placeholder="Введите ФИО"
        >

      </div>


      <!-- ДУ -->

      <div class="field">

        <label for="du">
          ДУ прибора
        </label>

        <select id="du">

          <option value="">
            — Выберите ДУ —
          </option>

          <option value="DN15 Modbus">
            DN15 Modbus
          </option>

          <option value="DN15 LoraWan">
            DN15 LoraWan
          </option>

          <option value="DN20 Modbus">
            DN20 Modbus
          </option>

          <option value="DN20 LoraWan">
            DN20 LoraWan
          </option>

          <option value="DN25 BR">
            DN25 BR
          </option>

          <option value="DN32 BR">
            DN32 BR
          </option>

          <option value="DN40 BR">
            DN40 BR
          </option>

          <option value="DN50 BR">
            DN50 BR
          </option>

          <option value="DN50 CLI">
            DN50 CLI
          </option>

          <option value="DN80 CLI">
            DN80 CLI
          </option>

          <option value="DN100 CLI">
            DN100 CLI
          </option>

          <option value="DN150 CLI">
            DN150 CLI
          </option>

          <option value="DN200 CLI">
            DN200 CLI
          </option>

        </select>

      </div>


      <button
        id="startButton"
        onclick="startScanner()"
      >
        📷 Начать сканирование
      </button>

    </div>


    <!-- ===================================================
         ТЕКУЩИЙ ИСПОЛНИТЕЛЬ / ДУ
    ==================================================== -->

    <div
      id="infoBox"
      class="info-box hidden"
    >

      Исполнитель:
      <strong id="executorInfo"></strong>

      <br>

      ДУ:
      <strong id="duInfo"></strong>

    </div>


    <!-- ===================================================
         КАМЕРА
    ==================================================== -->

    <div id="reader"></div>


    <!-- ===================================================
         СТАТУС
    ==================================================== -->

    <div
      id="status"
      class="status info"
    >
      Введите ФИО, выберите ДУ
      и нажмите «Начать сканирование».
    </div>


    <!-- ===================================================
         СЧЁТЧИК
    ==================================================== -->

    <div class="counter">

      <div class="counter-title">
        Отсканировано кодов
      </div>

      <span
        id="counter"
        class="counter-number"
      >
        0
      </span>

    </div>


    <!-- ===================================================
         ПОСЛЕДНИЙ НОМЕР
    ==================================================== -->

    <div
      id="last"
      class="last"
    >
      Последний номер: —
    </div>


    <!-- ===================================================
         ОСТАНОВИТЬ КАМЕРУ
    ==================================================== -->

    <button
      id="stopButton"
      class="stop-button hidden"
      onclick="stopScanner()"
    >
      ⏹ Остановить камеру
    </button>

  </div>


  <script>

    /* =====================================================
       НАСТРОЙКИ
    ===================================================== */

    const PIN = "77777";


    const API_URL =
      "https://script.google.com/macros/s/AKfycbxiZia7qBQmlgRQTm9eRX7qmRmczYimSoltss3URIbodkp5ZGPLO-Htl_7pVqAaqPPUaA/exec";


    /* =====================================================
       СОСТОЯНИЕ
    ===================================================== */

    let scanner = null;

    let scannerRunning = false;

    let processing = false;

    let count = 0;

    let lastScannedSerial = "";

    let lastScannedTime = 0;

    let executor = "";

    let du = "";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const pinScreen =
      document.getElementById(
        "pinScreen"
      );


    const pinInput =
      document.getElementById(
        "pinInput"
      );


    const pinError =
      document.getElementById(
        "pinError"
      );


    const app =
      document.getElementById(
        "app"
      );


    const setup =
      document.getElementById(
        "setup"
      );


    const executorInput =
      document.getElementById(
        "executor"
      );


    const duSelect =
      document.getElementById(
        "du"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const infoBox =
      document.getElementById(
        "infoBox"
      );


    const executorInfo =
      document.getElementById(
        "executorInfo"
      );


    const duInfo =
      document.getElementById(
        "duInfo"
      );


    const statusEl =
      document.getElementById(
        "status"
      );


    const counterEl =
      document.getElementById(
        "counter"
      );


    const lastEl =
      document.getElementById(
        "last"
      );


    const stopButton =
      document.getElementById(
        "stopButton"
      );


    /* =====================================================
       PIN
    ===================================================== */

    function checkPin() {

      const value =
        pinInput.value.trim();


      if (value === PIN) {

        pinScreen.classList.add(
          "hidden"
        );

        app.classList.remove(
          "hidden"
        );

        pinError.textContent = "";

        executorInput.focus();

      } else {

        pinError.textContent =
          "Неверный PIN-код";

        pinInput.value = "";

        pinInput.focus();

      }

    }


    pinInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          checkPin();

        }

      }
    );


    /* =====================================================
       STATUS
    ===================================================== */

    function setStatus(
      text,
      type
    ) {

      statusEl.className =
        "status " + type;

      statusEl.textContent =
        text;

    }


    /* =====================================================
       START SCANNER
    ===================================================== */

    function startScanner() {

      if (scannerRunning) {
        return;
      }


      executor =
        executorInput.value.trim();


      du =
        duSelect.value.trim();


      /* Проверяем ФИО */

      if (!executor) {

        alert(
          "Введите ФИО исполнителя."
        );

        executorInput.focus();

        return;

      }


      /* Проверяем ДУ */

      if (!du) {

        alert(
          "Выберите ДУ прибора."
        );

        duSelect.focus();

        return;

      }


      /* Проверяем библиотеку */

      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {

        setStatus(
          "Не загрузилась библиотека QR-сканера.",
          "error"
        );

        return;

      }


      startButton.disabled = true;

      executorInput.disabled = true;

      duSelect.disabled = true;


      /* Сбрасываем счётчик */

      count = 0;

      counterEl.textContent =
        "0";


      lastEl.textContent =
        "Последний номер: —";


      /* Показываем информацию */

      executorInfo.textContent =
        executor;

      duInfo.textContent =
        du;


      infoBox.classList.remove(
        "hidden"
      );


      setStatus(
        "Запрашиваем доступ к камере…",
        "info"
      );


      scanner =
        new Html5Qrcode(
          "reader"
        );


      /*
       * ВАЖНО:
       *
       * Не используем сложный
       * qrbox с функцией.
       *
       * Фиксированный размер
       * значительно стабильнее
       * на телефонах.
       */

      scanner
        .start(

          {
            facingMode:
              "environment"
          },

          {

            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            aspectRatio: 1.0

          },

          onScanSuccess,

          function(errorMessage) {

            /*
             * Ошибки отдельных кадров
             * игнорируем.
             */

          }

        )

        .then(function() {

          scannerRunning = true;

          stopButton.classList.remove(
            "hidden"
          );


          setStatus(
            "Наведите камеру на QR-код",
            "info"
          );

        })

        .catch(function(error) {

          scannerRunning = false;

          startButton.disabled = false;

          executorInput.disabled = false;

          duSelect.disabled = false;


          setStatus(
            "❌ Не удалось открыть камеру: " +
            error,
            "error"
          );

        });

    }


    /* =====================================================
       QR FOUND
    ===================================================== */

    function onScanSuccess(
      decodedText
    ) {

      /*
       * Пока предыдущий QR
       * сохраняется — новый
       * не обрабатываем.
       */

      if (processing) {
        return;
      }


      /*
       * QR содержит ТОЛЬКО
       * серийный номер.
       *
       * Поэтому ничего
       * из него не вырезаем.
       */

      const serial =
        String(
          decodedText || ""
        ).trim();


      if (!serial) {
        return;
      }


      /*
       * Защита от повторного
       * распознавания одного QR
       * камерой подряд.
       */

      const now =
        Date.now();


      if (
        serial ===
          lastScannedSerial &&
        (
          now -
          lastScannedTime
        ) < 2000
      ) {

        return;

      }


      lastScannedSerial =
        serial;

      lastScannedTime =
        now;


      processing = true;


      setStatus(
        "⏳ Записываем: " +
        serial,
        "info"
      );


      saveSerial(
        serial
      );

    }


    /* =====================================================
       SAVE SERIAL
    ===================================================== */

    function saveSerial(
      serial
    ) {

      const callbackName =
        "qrCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      /*
       * Таймаут
       */

      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;

            cleanup();

            processing = false;


            setStatus(
              "❌ Google Sheets не ответил. Проверьте интернет.",
              "error"
            );

          },
          15000
        );


      /*
       * Ответ Google Apps Script
       */

      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }


          finished = true;

          clearTimeout(
            timeout
          );

          cleanup();


          /* ===============================================
             УСПЕШНАЯ ЗАПИСЬ
          =============================================== */

          if (
            result &&
            result.success
          ) {

            /*
             * Увеличиваем счётчик
             * ТОЛЬКО после ответа
             * сервера об успешной записи.
             */

            count++;


            counterEl.textContent =
              count;


            lastEl.textContent =
              "Последний номер: " +
              result.serial;


            setStatus(
              "🟢 Записано: " +
              result.serial,
              "success"
            );


          }


          /* ===============================================
             ДУБЛИКАТ
          =============================================== */

          else if (
            result &&
            result.duplicate
          ) {

            lastEl.textContent =
              "Повтор: " +
              result.serial;


            setStatus(
              "⚠️ Этот код уже есть в таблице: " +
              result.serial,
              "duplicate"
            );

          }


          /* ===============================================
             ОШИБКА
          =============================================== */

          else {

            setStatus(
              "❌ Ошибка: " +
              (
                result &&
                result.message
                  ? result.message
                  : "Неизвестная ошибка"
              ),
              "error"
            );

          }


          /*
           * Разрешаем следующий QR.
           */

          setTimeout(
            function() {

              processing = false;


              if (
                scannerRunning
              ) {

                setStatus(
                  "Наведите на следующий QR-код",
                  "info"
                );

              }

            },
            800
          );

        };


      /*
       * Ошибка загрузки запроса
       */

      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;

          clearTimeout(
            timeout
          );

          cleanup();

          processing = false;


          setStatus(
            "❌ Не удалось связаться с Google Sheets.",
            "error"
          );

        };


      /*
       * Формируем URL
       */

      const url =
        API_URL +
        "?action=save" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&executor=" +
        encodeURIComponent(
          executor
        ) +
        "&du=" +
        encodeURIComponent(
          du
        ) +
        "&serial=" +
        encodeURIComponent(
          serial
        ) +
        "&t=" +
        Date.now();


      script.src =
        url;


      document.body.appendChild(
        script
      );


      /*
       * Очистка callback
       */

      function cleanup() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    }


    /* =====================================================
       STOP SCANNER
    ===================================================== */

    function stopScanner() {

      if (
        !scanner ||
        !scannerRunning
      ) {

        return;

      }


      scanner
        .stop()

        .then(function() {

          scannerRunning =
            false;


          try {

            scanner.clear();

          } catch (e) {}


          stopButton.classList.add(
            "hidden"
          );


          startButton.disabled =
            false;


          executorInput.disabled =
            false;


          duSelect.disabled =
            false;


          setStatus(
            "Сканирование остановлено.",
            "info"
          );

        })

        .catch(function() {

          scannerRunning =
            false;


          stopButton.classList.add(
            "hidden"
          );

          startButton.disabled =
            false;


          executorInput.disabled =
            false;


          duSelect.disabled =
            false;

        });

    }

  </script>

</body>

</html>
