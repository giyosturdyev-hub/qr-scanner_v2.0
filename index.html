<body>

<div
  id="pinScreen"
  class="pin-screen"
>

  <div class="pin-box">

    <div class="pin-title">
      🔐 Доступ к сканеру
    </div>

    <div class="pin-subtitle">
      Введите PIN-код

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      maxlength="5"
      placeholder="•••••"
      autocomplete="off"
    >

    <button
      onclick="checkPin()"
    >
      Войти
    </button>

      id="pinError"

    ></div>

  </div>

</div>


<!-- ==================================================
     APPLICATION
================================================== -->

<div
  id="app"
  class="app hidden"
>

  <h1>
    Сканер серийных номеров
  </h1>


  <!-- SETUP -->

  <div
    id="setup"
    class="card"
  >

    <div class="field">

      <label>
        Имя и фамилия исполнителя
      </label>

      <input
        id="executor"
        type="text"
        autocomplete="name"
        placeholder="Например: Иван Иванов"
      >

    </div>


    <div class="field">

      <label>
        ДУ прибора
      </label>

      <select id="du">

        <option value="">
          — Выберите ДУ —
        </option>

        <option>
          DN15 Modbus
        </option>

        <option>
          DN15 LoraWan
        </option>

        <option>
          DN20 Modbus
        </option>

        <option>
          DN20 LoraWan
        </option>

        <option>
          DN25 BR
        </option>

        <option>
          DN32 BR
        </option>

        <option>
          DN40 BR
        </option>

        <option>
          DN50 BR
        </option>

        <option>
          DN50 CLI
        </option>

        <option>
          DN80 CLI
        </option>

        <option>
          DN100 CLI
        </option>

        <option>
          DN150 CLI
        </option>

        <option>
          DN200 CLI
        </option>

      </select>

    </div>


    <button
      id="startButton"
      onclick="startScanning()"
    >
      📷 Начать сканирование
    </button>

  </div>


  <!-- SCANNER -->

  <div
    id="scannerBlock"
    class="hidden"
  >

    <div class="session-info">

      <div class="info-box">

        <span class="info-label">
          Исполнитель
        </span>

        <span
          id="executorDisplay"
          class="info-value"
        >
          —
        </span>

      </div>


      <div class="info-box">

        <span class="info-label">
          Дата
        </span>

        <span
          id="dateDisplay"
          class="info-value"
        >
          —
        </span>

      </div>

    </div>


    <div
      id="reader"
      style="margin-top:12px;"
    ></div>


    <div
      id="status"
      class="status info"
    >

    </div>

        </div>

        <span

        >
          0

        <div class="stat-title">

    </button>

</div>


<script>


/****************************************************
 * НАСТРОЙКИ
 ****************************************************/


const PIN = "77777";


const API_URL =
  "https://script.google.com/macros/s/AKfycbx6zReFKG81GzJJ9XRgp-ikWi25IgPWSLFiMS9b4Qj3PwYyy0GcMdoHqaR4bDkFOzbLMg/exec";


/****************************************************
 * СОСТОЯНИЕ
 ****************************************************/


let scanner = null;

let scanning = false;

let processing = false;

let count = 0;

let duplicates = 0;

let lastSerial = "";

let lastScanTime = 0;


let executor = "";

let du = "";

let today = "";


/****************************************************
 * ELEMENTS
 ****************************************************/


const pinScreen =
  document.getElementById("pinScreen");


const app =
  document.getElementById("app");


const pinInput =
  document.getElementById("pinInput");


const pinError =
  document.getElementById("pinError");


const executorInput =
  document.getElementById("executor");


const duSelect =
  document.getElementById("du");


const setup =
  document.getElementById("setup");


const scannerBlock =
  document.getElementById("scannerBlock");


const executorDisplay =
  document.getElementById("executorDisplay");


const dateDisplay =
  document.getElementById("dateDisplay");


const statusEl =
  document.getElementById("status");


const countEl =
  document.getElementById("count");


const duplicatesEl =
  document.getElementById("duplicates");


const lastEl =
  document.getElementById("last");


const startButton =
  document.getElementById("startButton");


/****************************************************
 * PIN
 ****************************************************/


function checkPin() {

  if (
    pinInput.value.trim()
    === PIN
  ) {

    pinScreen.classList.add(
      "hidden"
    );

    app.classList.remove(
      "hidden"
    );

    pinError.textContent = "";

    executorInput.focus();

  } else {

    pinError.textContent =
      "Неверный PIN-код";

    pinInput.value = "";

    pinInput.focus();

  }

}


pinInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      checkPin();
    }

  }
);


/****************************************************
 * STATUS
 ****************************************************/


function setStatus(
  text,
  className
) {

  statusEl.className =
    "status " +
    className;

  statusEl.textContent =
    text;

}


/****************************************************
 * DATE
 ****************************************************/


function getToday() {

  const now =
    new Date();

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const year =
    now.getFullYear();

  return (
    day +
    "." +
    month +
    "." +
    year
  );

}


/****************************************************
 * START SCANNING
 ****************************************************/


function startScanning() {

  executor =
    executorInput.value.trim();


  du =
    duSelect.value.trim();


  if (!executor) {

    alert(
      "Введите имя и фамилию исполнителя."
    );

    executorInput.focus();

    return;

  }


  if (!du) {

    alert(
      "Выберите ДУ прибора."
    );

    duSelect.focus();

    return;

  }


  today =
    getToday();


  executorDisplay.textContent =
    executor;


  dateDisplay.textContent =
    today;


  count = 0;

  duplicates = 0;

  lastSerial = "";

  lastScanTime = 0;


  countEl.textContent = "0";

  duplicatesEl.textContent = "0";

  lastEl.textContent =
    "Последний номер: —";


  setup.classList.add(
    "hidden"
  );


  scannerBlock.classList.remove(
    "hidden"
  );


  startButton.disabled = true;


  setStatus(
    "Запрашиваем доступ к камере…",
    "info"
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanning = true;


  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );


        return {

          width:
            Math.max(
              200,
              size
            ),

          height:
            Math.max(
              200,
              size
            )

        };

      },

      aspectRatio: 1.0

    },

    onScanSuccess,

    function() {}

  )

  .then(function() {

    setStatus(
      "Наведите камеру на QR-код",
      "info"
    );

  })

  .catch(function(error) {

    scanning = false;

    startButton.disabled = false;

    setStatus(
      "Не удалось запустить камеру. " +
      String(error),
      "error"
    );

  });

}


/****************************************************
 * QR SUCCESS
 ****************************************************/


function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  const serial =
    String(
      decodedText || ""
    ).trim();


  if (!serial) {
    return;
  }


  const now =
    Date.now();


  /*
   * Камера может несколько раз подряд
   * увидеть один и тот же QR.
   */

  if (
    serial === lastSerial &&
    now - lastScanTime < 2500
  ) {

    return;

  }


  processing = true;

  lastSerial = serial;

  lastScanTime = now;


  setStatus(
    "⏳ Проверяем " + serial,
    "info"
  );


  saveSerial(serial);

}


/****************************************************
 * SAVE
 ****************************************************/


function saveSerial(
  serial
) {

  const callbackName =
    "qr_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let finished = false;


  const timeout =
    setTimeout(
      function() {

        if (finished) {
          return;
        }


        finished = true;

        cleanup();

        processing = false;


        setStatus(
          "❌ Нет ответа от Google Sheets",
          "error"
        );

      },
      15000
    );


  window[callbackName] =
    function(response) {

      if (finished) {
        return;
      }


      finished = true;

      clearTimeout(timeout);

      cleanup();


      if (
        response &&
        response.success
      ) {

        count =
          Number(
            response.count || 0
          );


        countEl.textContent =
          count;


        lastEl.textContent =
          "Последний номер: " +
          response.serial;


        setStatus(
          "🟢 ДОБАВЛЕНО: " +
          response.serial,
          "success"
        );


      } else if (
        response &&
        response.duplicate
      ) {

        duplicates++;

        duplicatesEl.textContent =
          duplicates;


        lastEl.textContent =
          "Повтор: " +
          response.serial;


        setStatus(
          "⚠️ ДУБЛИКАТ: " +
          response.serial,
          "duplicate"
        );


      } else {

        setStatus(
          "❌ " +
          (
            response &&
            response.message
              ? response.message
              : "Ошибка"
          ),
          "error"
        );

      }


      setTimeout(
        function() {

          processing = false;

          if (scanning) {

            setStatus(
              "Наведите на следующий QR-код",
              "info"
            );

          }

        },
        800
      );

    };


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;

      clearTimeout(timeout);

      cleanup();

      processing = false;


      setStatus(
        "❌ Ошибка связи с Google Sheets",
        "error"
      );

    };


  let url =
    API_URL +
    "?action=save" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&executor=" +
    encodeURIComponent(
      executor
    ) +
    "&du=" +
    encodeURIComponent(
      du
    ) +
    "&serial=" +
    encodeURIComponent(
      serial
    ) +
    "&t=" +
    Date.now();


  script.src = url;


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


/****************************************************
 * STOP
 ****************************************************/


function stopScanning() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  scanner
    .stop()

    .then(function() {

      scanning = false;

      try {
        scanner.clear();
      } catch (e) {}

      scanner = null;

      processing = false;

      scannerBlock.classList.add(
        "hidden"
      );

      setup.classList.remove(
        "hidden"
      );

      startButton.disabled = false;

      setStatus(
        "Сканирование остановлено",
        "info"
      );

    })

    .catch(function() {

      scanning = false;

      processing = false;

      scanner = null;

      scannerBlock.classList.add(
        "hidden"
      );

      setup.classList.remove(
        "hidden"
      );

      startButton.disabled = false;

    });

}

</script>

</body>

</html>
